apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: tarsedb
  namespace: tars-edb
spec:
  instances: 1
  imageName:  image-registry.openshift-image-registry.svc:5000/tars-images/edb-postgresql:18.6-standard-ubi9
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      dataChecksums: true
      import:
        type: monolith
        schemaOnly: true
        databases:
        - "*"
        roles:
        - "*"
        source:
          externalCluster: crunchy
  externalClusters:
    - name: crunchy
      connectionParameters:
        host: tarsrestore-primary.tars-restore.svc.cluster.local
        port: "5432"
        user: miguser
        dbname: postgres
      password:
        name: miguser
        key: password
    - name: tarsedb
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: tarsedb-primaryobject-store
          serverName: tarsedb
    - name: tarsedbdr
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: tarsedb-drobject-store
          serverName: tarsedbdr
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tarsedb-primaryobject-store
        serverName: tarsedb
  storage:
    size: 100Gi
  walStorage:
    size: 20Gi
  resources:
    requests:
      memory: "8Gi"
      cpu: "1"
    limits:
      memory: "8Gi"
      cpu: "1"
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "4GB"
      effective_cache_size: "12GB"
      work_mem: "8MB"
      maintenance_work_mem: "1GB"
      autovacuum_work_mem: "512MB"
      min_wal_size: "2GB"
      max_wal_size: "3GB"
      max_replication_slots: "10"
      wal_sender_timeout: "30s"
      wal_receiver_timeout: "30s"
      max_worker_processes: "8"
      max_parallel_workers: "2"
      random_page_cost: "1.1"
      effective_io_concurrency: "100"
      maintenance_io_concurrency: "100"
      log_min_duration_statement: "5s"
      pgaudit.log: "none"
      log_statement: "ddl"
      log_lock_waits: "on"
      log_temp_files: "0"
      track_io_timing: "on"
      lc_messages: "C"
      lc_monetary: "en_US.UTF-8"
      lc_numeric: "en_US.UTF-8"
      lc_time: "en_US.UTF-8"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_vacuum_insert_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_vacuum_cost_limit: "800"

