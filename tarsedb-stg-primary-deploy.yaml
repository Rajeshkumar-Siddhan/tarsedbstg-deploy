---
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: tarsedb
  namespace: tars-edb
spec:
  instances: 3
  imageName: image-registry.openshift-image-registry.svc:5000/tars-images/edb-postgresql:18.6-standard-ubi9
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      dataChecksums: true
  replica:
    primary: tarsedb
    source: tarsedbdr
  externalClusters:
    - name: tarsedb
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: tarsedb-primaryobject-store
          serverName: tarsedb
    - name: tarsedbdr
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: tarsedb-drobject-store
          serverName: tarsedbdr
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tarsedb-primaryobject-store
        serverName: tarsedb
  storage:
    size: 100Gi
  walStorage:
    size: 20Gi
  resources:
    requests:
      memory: "16Gi"
      cpu: "1"
    limits:
      memory: "16Gi"
      cpu: "1"
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "4GB"
      effective_cache_size: "12GB"
      work_mem: "8MB"
      maintenance_work_mem: "1GB"
      autovacuum_work_mem: "512MB"
      min_wal_size: "2GB"
      max_wal_size: "3GB"
      max_replication_slots: "10"
      wal_sender_timeout: "30s"
      wal_receiver_timeout: "30s"
      max_worker_processes: "8"    #set to 60 if this is target for logical replication 
      #max_active_replication_origins: "40" 
      #max_logical_replication_workers: "40"
      max_parallel_workers: "2"
      random_page_cost: "1.1"
      effective_io_concurrency: "100"
      maintenance_io_concurrency: "100"
      log_min_duration_statement: "5s"
      log_statement: "ddl"
      log_lock_waits: "on"
      log_temp_files: "0"
      track_io_timing: "on"
      lc_messages: "C"
      lc_monetary: "en_US.UTF-8"
      lc_numeric: "en_US.UTF-8"
      lc_time: "en_US.UTF-8"
      pgaudit.log: "none"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_vacuum_insert_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_vacuum_cost_limit: "800"
---
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Pooler
metadata:
  name: tarsedb-pgbouncer-rw
  namespace: tars-edb
spec:
  cluster:
    name: tarsedb
  instances: 2
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "400"
      max_db_connections: "200"
      ignore_startup_parameters: "extra_float_digits,options"
  template:
    spec:
      containers:
        - name: pgbouncer
          image: image-registry.openshift-image-registry.svc:5000/tars-images/pgbouncer:1.25.2-ubi9
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tarsedb
  namespace: tars-edb
spec:
  selector:
    matchLabels:
      k8s.enterprisedb.io/cluster: tarsedb
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        - action: replace
          sourceLabels: [__name__]
          regex: 'cnp_(.*)'
          targetLabel: __name__
          replacement: 'cnpg_$1'
---
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: ScheduledBackup
metadata:
  name: fullbackup-tarsedb
  namespace: tars-edb
spec:
  schedule: "0 0 2 * * 0,3"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: tarsedb
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---

