apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: tarsedb-primaryobject-store
  namespace: tars-edb
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        cpu: "2000m"
        memory: "1Gi"
  configuration:
    destinationPath: "s3://postgres-backup/"
    endpointURL: "https://rtauevtrsbkpst1.ocptrsstg01.rtatestdom.local"
    endpointCA:
        name:   tarsedb-s3-ca
        key:    ca.crt
    s3Credentials:
      accessKeyId:
        name: tarsedb-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: tarsedb-s3-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: snappy
      maxParallel: 4
    data:
      compression: snappy
      jobs: 4
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: tarsedb-drobject-store
  namespace: tars-edb
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        cpu: "2000m"
        memory: "1Gi"
  configuration:
    destinationPath: "s3://postgres-backup/"
    endpointURL: "https://rtauevtrsbkpst1.ocptrsstg01.rtatestdom.local"
    endpointCA:
        name:   tarsedb-s3-ca
        key:    ca.crt
    s3Credentials:
      accessKeyId:
        name: tarsedb-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: tarsedb-s3-creds
